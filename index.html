<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vietnam Macro Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- PapaParse -->
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="mb-4 text-center">Vietnam Macro Data Dashboard</h1>
        
        <div class="row mb-4">
            <div class="col-md-12">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Vietnam GDP Trend (Constant LCU)</h5>
                        <canvas id="gdpChart" height="100"></canvas>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row mb-4">
            <div class="col-md-12">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">GDP Components (Latest Year)</h5>
                        <canvas id="componentsChart" height="100"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-12">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Vietnam Exports vs Imports (Constant LCU)</h5>
                        <canvas id="tradeChart" height="100"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-12">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Chỉ số giá tiêu dùng (CPI)</h5>
                        <canvas id="cpiChart" height="100"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-12">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Tổng mức bán lẻ hàng hóa và doanh thu dịch vụ tiêu dùng</h5>
                        <canvas id="retailChart" height="100"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            Papa.parse("raw_data.csv", {
                download: true,
                header: true,
                dynamicTyping: true,
                skipEmptyLines: true,
                complete: function(results) {
                    const data = results.data;
                    
                    const getYear = (dateStr) => {
                        if (!dateStr) return '';
                        return String(dateStr).substring(0, 4);
                    };

                    // --- Process for GDP Line Chart ---
                    const gdpData = data.filter(row => row.variable_name === 'Vietnam GDP (Constant LCU)' && row.value != null);
                    gdpData.sort((a, b) => String(a.date).localeCompare(String(b.date)));
                    
                    const gdpLabels = gdpData.map(row => getYear(row.date));
                    const gdpValues = gdpData.map(row => row.value);

                    const ctxGdp = document.getElementById('gdpChart').getContext('2d');
                    new Chart(ctxGdp, {
                        type: 'line',
                        data: {
                            labels: gdpLabels,
                            datasets: [{
                                label: 'Vietnam GDP (Constant LCU)',
                                data: gdpValues,
                                borderColor: 'rgba(75, 192, 192, 1)',
                                backgroundColor: 'rgba(75, 192, 192, 0.2)',
                                borderWidth: 2,
                                fill: true,
                                tension: 0.1
                            }]
                        },
                        options: {
                            responsive: true,
                            scales: {
                                y: {
                                    beginAtZero: false
                                }
                            }
                        }
                    });

                    // --- Process for Components Bar Chart ---
                    let latestDateStr = "";
                    data.forEach(row => {
                        if (row.date && String(row.date) > latestDateStr) {
                            latestDateStr = String(row.date);
                        }
                    });

                    const targetVariables = [
                        'Vietnam Consumption (Constant LCU)',
                        'Vietnam Government Spending (Constant LCU)',
                        'Vietnam Investment (Constant LCU)',
                        'Vietnam Exports (Constant LCU)',
                        'Vietnam Imports (Constant LCU)'
                    ];

                    const latestData = data.filter(row => String(row.date) === latestDateStr && targetVariables.includes(row.variable_name));

                    const compValues = targetVariables.map(tv => {
                        const row = latestData.find(r => r.variable_name === tv);
                        return row ? row.value : 0;
                    });
                    
                    const shortLabels = [
                        'Consumption',
                        'Govt Spending',
                        'Investment',
                        'Exports',
                        'Imports'
                    ];

                    const ctxComp = document.getElementById('componentsChart').getContext('2d');
                    new Chart(ctxComp, {
                        type: 'bar',
                        data: {
                            labels: shortLabels,
                            datasets: [{
                                label: 'Value (Constant LCU) in ' + getYear(latestDateStr),
                                data: compValues,
                                backgroundColor: [
                                    'rgba(54, 162, 235, 0.6)',
                                    'rgba(255, 99, 132, 0.6)',
                                    'rgba(255, 206, 86, 0.6)',
                                    'rgba(75, 192, 192, 0.6)',
                                    'rgba(153, 102, 255, 0.6)'
                                ],
                                borderColor: [
                                    'rgba(54, 162, 235, 1)',
                                    'rgba(255, 99, 132, 1)',
                                    'rgba(255, 206, 86, 1)',
                                    'rgba(75, 192, 192, 1)',
                                    'rgba(153, 102, 255, 1)'
                                ],
                                borderWidth: 1
                            }]
                        },
                        options: {
                            responsive: true,
                            scales: {
                                y: {
                                    beginAtZero: true
                                }
                            }
                        }
                    });

                    // --- Process for Trade Chart (Exports vs Imports) ---
                    const exportsData = data.filter(row => row.variable_name === 'Vietnam Exports (Constant LCU)' && row.value != null);
                    const importsData = data.filter(row => row.variable_name === 'Vietnam Imports (Constant LCU)' && row.value != null);
                    
                    exportsData.sort((a, b) => String(a.date).localeCompare(String(b.date)));
                    importsData.sort((a, b) => String(a.date).localeCompare(String(b.date)));
                    
                    const tradeYears = [...new Set([...exportsData, ...importsData].map(r => getYear(r.date)))].sort();
                    
                    const exportsValues = tradeYears.map(y => {
                        const row = exportsData.find(r => getYear(r.date) === y);
                        return row ? row.value : null;
                    });
                    const importsValues = tradeYears.map(y => {
                        const row = importsData.find(r => getYear(r.date) === y);
                        return row ? row.value : null;
                    });

                    const ctxTrade = document.getElementById('tradeChart').getContext('2d');
                    new Chart(ctxTrade, {
                        type: 'line',
                        data: {
                            labels: tradeYears,
                            datasets: [
                                {
                                    label: 'Exports (Constant LCU)',
                                    data: exportsValues,
                                    borderColor: 'rgba(54, 162, 235, 1)',
                                    backgroundColor: 'rgba(54, 162, 235, 0.2)',
                                    borderWidth: 2,
                                    fill: false,
                                    tension: 0.1
                                },
                                {
                                    label: 'Imports (Constant LCU)',
                                    data: importsValues,
                                    borderColor: 'rgba(255, 99, 132, 1)',
                                    backgroundColor: 'rgba(255, 99, 132, 0.2)',
                                    borderWidth: 2,
                                    fill: false,
                                    tension: 0.1
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            scales: {
                                y: {
                                    beginAtZero: false
                                }
                            }
                        }
                    });

                    // --- Process for CPI Chart ---
                    const cpiData = data.filter(row => row.variable_name === 'Chỉ số giá tiêu dùng (CPI)' && row.value != null);
                    cpiData.sort((a, b) => String(a.date).localeCompare(String(b.date)));
                    
                    const cpiLabels = cpiData.map(row => String(row.date));
                    const cpiValues = cpiData.map(row => row.value);

                    const ctxCpi = document.getElementById('cpiChart').getContext('2d');
                    new Chart(ctxCpi, {
                        type: 'line',
                        data: {
                            labels: cpiLabels,
                            datasets: [{
                                label: 'Chỉ số giá tiêu dùng (CPI)',
                                data: cpiValues,
                                borderColor: 'rgba(255, 159, 64, 1)',
                                backgroundColor: 'rgba(255, 159, 64, 0.2)',
                                borderWidth: 2,
                                fill: true,
                                tension: 0.1
                            }]
                        },
                        options: {
                            responsive: true,
                            scales: {
                                y: {
                                    beginAtZero: false
                                }
                            }
                        }
                    });

                    // --- Process for Retail Sales Chart ---
                    const retailData = data.filter(row => row.variable_name === 'Tổng mức bán lẻ hàng hóa và doanh thu dịch vụ tiêu dùng' && row.value != null);
                    retailData.sort((a, b) => String(a.date).localeCompare(String(b.date)));
                    
                    const retailLabels = retailData.map(row => String(row.date));
                    const retailValues = retailData.map(row => row.value);

                    const ctxRetail = document.getElementById('retailChart').getContext('2d');
                    new Chart(ctxRetail, {
                        type: 'bar',
                        data: {
                            labels: retailLabels,
                            datasets: [{
                                label: 'Tổng mức bán lẻ hàng hóa và doanh thu dịch vụ tiêu dùng',
                                data: retailValues,
                                backgroundColor: 'rgba(153, 102, 255, 0.6)',
                                borderColor: 'rgba(153, 102, 255, 1)',
                                borderWidth: 1
                            }]
                        },
                        options: {
                            responsive: true,
                            scales: {
                                y: {
                                    beginAtZero: true
                                }
                            }
                        }
                    });

                }
            });
        });
    </script>
</body>
</html>
